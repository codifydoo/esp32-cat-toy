<html lang="en">
<head>
<meta charset="utf-8">
<title>App icon</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: {{s}}px; height: {{s}}px;">

<rect x="94" y="44" width="52" height="96" rx="26" fill="#FFF6E6" stroke="{{a.ring}}" stroke-width="8"></rect>
<path d="M107 76 L133 76 M107 96 L133 96 M107 116 L133 116" fill="none" stroke="{{a.ring}}" stroke-width="6" stroke-linecap="round"></path>
</g>
<g display="{{g.pet}}">
<path d="M120 196 C62 158 42 120 58 90 C72 64 106 62 120 92 C134 62 168 64 182 90 C198 120 178 158 120 196 Z" fill="#FFF6E6" stroke="{{a.ring}}" stroke-width="8" stroke-linejoin="round"></path>
<ellipse cx="120" cy="140" rx="24" ry="19" fill="{{a.bg}}"></ellipse>

<circle cx="110" cy="100" r="9" fill="{{a.bg}}"></circle>
<circle cx="130" cy="100" r="9" fill="{{a.bg}}"></circle>

<path d="M46 170 A74 74 0 0 1 194 170" fill="none" stroke="#FF5A5A" stroke-width="16" stroke-linecap="round"></path>
<path d="M70 170 A50 50 0 0 1 170 170" fill="none" stroke="#FFD84A" stroke-width="16" stroke-linecap="round"></path>
<path d="M94 170 A26 26 0 0 1 146 170" fill="none" stroke="#5CE0FF" stroke-width="16" stroke-linecap="round"></path>
<path d="M66 50 Q66 70 86 70 Q66 70 66 90 Q66 70 46 70 Q66 70 66 50 Z M178 58 Q178 72 192 72 Q178 72 178 86 Q178 72 164 72 Q178 72 178 58 Z" fill="#FFF6E6"></path>
</g>
<g display="{{g.yarn}}">

</g>
<g display="{{g.clock}}">
<circle cx="112" cy="124" r="62" fill="#FFE58A" stroke="{{a.ring}}" stroke-width="8"></circle>
<circle cx="142" cy="102" r="52" fill="{{a.bg}}"></circle>
<path d="M170 138 Q170 152 184 152 Q170 152 170 166 Q170 152 156 152 Q170 152 170 138 Z M168 52 Q168 62 178 62 Q168 62 168 72 Q168 62 158 62 Q168 62 168 52 Z" fill="#FFF6E6"></path>
</g>

<rect x="72" y="98" width="22" height="46" rx="5" fill="{{a.ring}}"></rect>
<rect x="146" y="98" width="22" height="46" rx="5" fill="{{a.ring}}"></rect>
</g>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"app":{"editor":"int","min":0,"max":5,"default":0},"size":{"editor":"int","min":48,"max":320,"default":240},"$preview":{"width":240,"height":240}}'>
class Component extends DCLogic {
  renderVals() {
    const APPS = [
      { key: 'voices', bg: '#FF5FA2', ring: '#9E1F5C' },
      { key: 'pet', bg: '#FFB547', ring: '#9A5A00' },
      { key: 'draw', bg: '#8A7BFF', ring: '#3F2FA8' },
      { key: 'yarn', bg: '#2FC4A0', ring: '#0E6B55' },
      { key: 'clock', bg: '#3D7BFF', ring: '#16378F' },
      { key: 'piano', bg: '#FF7A45', ring: '#9A3510' }
    ];
    const i = Math.max(0, Math.min(5, Number(this.props.app) || 0));
    const a = APPS[i];
    const g = {};
    APPS.forEach((x) => { g[x.key] = x.key === a.key ? 'inline' : 'none'; });
    return { a: a, g: g, s: Number(this.props.size) || 240 };
  }
}
</script>
</body>
</html>
